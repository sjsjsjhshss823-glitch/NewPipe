name: Build unsigned release APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Record build metadata
        if: success()
        run: |
          VERSION_NAME="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          echo "## APK build" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

# Trigger a fresh release build after workflow setup.
