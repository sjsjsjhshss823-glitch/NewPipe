name: Build installable APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - feature/music-tabs
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build installable APK
        run: ./gradlew --no-daemon --console=plain assembleContinuous --stacktrace --info

      - name: Record build metadata
        if: success()
        run: |
          VERSION_NAME="$(jq -r '.elements[0].versionName' app/build/outputs/apk/continuous/output-metadata.json)"
          echo "## Installable APK build" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $VERSION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Variant: continuous (debug-signed)" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk/continuous -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload installable APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-installable-APK
          path: app/build/outputs/apk/continuous/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
